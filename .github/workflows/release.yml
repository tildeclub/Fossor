name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Keep release builds on older supported runners for compatibility.
        # Newer OS versions are covered by the CI workflow.
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            listener: systemd,inetd,xinetd
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            listener: systemd,inetd,xinetd
          - name: macos-x86_64
            runner: macos-15-intel
            listener: mac
          - name: macos-arm64
            runner: macos-15
            listener: mac

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install GNU sed on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set binary version from release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          sed -i -E "s/^VERSION[[:space:]]*=.*/VERSION  = ${version}/" Makefile.in

      - name: Configure
        env:
          LISTENER: ${{ matrix.listener }}
        run: ./configure --listener="$LISTENER" --hostname=localhost

      - name: Build
        run: make -j2

      - name: Smoke tests
        run: sh tests/smoke.sh

      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.name }}
        run: |
          package="gophernicus-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${package}"
          cp src/gophernicus LICENSE README.md INSTALL.md gophernicus.8 "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "$package"
          rm -rf "dist/${package}"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach release assets
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Upload to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
