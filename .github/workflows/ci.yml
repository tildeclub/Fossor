name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.runner }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            compiler: gcc
            listener: systemd,inetd,xinetd
          - runner: ubuntu-24.04
            compiler: clang
            listener: systemd,inetd,xinetd
          - runner: macos-15-intel
            compiler: clang
            listener: mac
          - runner: macos-15
            compiler: clang
            listener: mac
    env:
      CC: ${{ matrix.compiler }}
      HOSTCC: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwrap0-dev

      # configure uses GNU sed's in-place syntax.
      - name: Install GNU sed on macOS
        if: runner.os == 'macOS'
        run: |
          brew install gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Configure
        env:
          LISTENER: ${{ matrix.listener }}
        run: ./configure --listener="$LISTENER" --hostname=localhost

      - name: Build
        run: make -j2

      - name: Smoke tests
        run: sh tests/smoke.sh
